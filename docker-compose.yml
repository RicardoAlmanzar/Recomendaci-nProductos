version: '3.8'

services:
  engine:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_DATABASE_URL=postgresql://postgres:postgres@db:5432/recomendacion_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=recomendacion_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recomendacion_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
