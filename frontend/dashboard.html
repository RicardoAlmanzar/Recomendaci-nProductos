<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Métricas — Motor de Recomendaciones</title>
  <meta name="description" content="Panel de evaluación y métricas del motor de recomendaciones. CTR, conversión, top productos.">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ─── Dashboard-specific design system ─── */
    .dash-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    /* ─── Header ─── */
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }
    .dash-header-left { flex: 1; }
    .dash-title {
      margin: 0 0 4px;
      font-size: clamp(1.6rem, 2.2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .dash-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.88rem;
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }

    /* ─── Controls strip ─── */
    .controls-strip {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding: 16px 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(217,224,236,0.9);
      border-radius: 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }
    .controls-strip .field-sm {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .controls-strip .field-sm input[type="number"] {
      width: 80px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      font-size: 0.92rem;
      color: var(--text);
      background: #fff;
    }
    .controls-strip .field-sm input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36,87,255,0.10);
    }
    .btn-primary {
      border: 0;
      border-radius: 12px;
      padding: 10px 20px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(36,87,255,0.22);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .last-update {
      margin-left: auto;
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      align-self: center;
    }

    /* ─── KPI Grid ─── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: rgba(255,255,255,0.95);
      border: 1px solid rgba(217,224,236,0.9);
      border-radius: 18px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 50px rgba(20,34,60,0.12);
    }
    .kpi-card.accent {
      background: linear-gradient(135deg, #2457ff 0%, #4d7aff 100%);
      color: #fff;
      border-color: transparent;
    }
    .kpi-card.accent .kpi-label { color: rgba(255,255,255,0.75); }
    .kpi-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .kpi-value {
      display: block;
      font-size: clamp(1.6rem, 2vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .kpi-unit {
      font-size: 0.7em;
      font-weight: 500;
      opacity: 0.7;
    }

    /* ─── Health Panel ─── */
    .health-section {
      margin-bottom: 24px;
    }
    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
    .health-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 0.9rem;
      transition: border-color 0.15s;
    }
    .health-dot {
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .health-dot.green { background: var(--success); box-shadow: 0 0 6px rgba(15,139,95,0.35); }
    .health-dot.blue { background: var(--accent); box-shadow: 0 0 6px rgba(36,87,255,0.30); }
    .health-dot.amber { background: #d97706; box-shadow: 0 0 6px rgba(217,119,6,0.30); }
    .health-dot.gray { background: #94a3b8; }

    /* ─── Table ─── */
    .table-section {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(217,224,236,0.9);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .table-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .table-header .table-count {
      font-size: 0.82rem;
      color: var(--muted);
    }
    .products-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .products-table thead th {
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    .products-table thead th:last-child,
    .products-table thead th:nth-child(3),
    .products-table thead th:nth-child(4),
    .products-table thead th:nth-child(5) {
      text-align: right;
    }
    .products-table tbody td {
      padding: 12px 14px;
      font-size: 0.92rem;
      border-bottom: 1px solid rgba(217,224,236,0.5);
      vertical-align: middle;
    }
    .products-table tbody td:last-child,
    .products-table tbody td:nth-child(3),
    .products-table tbody td:nth-child(4),
    .products-table tbody td:nth-child(5) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .products-table tbody tr:last-child td {
      border-bottom: 0;
    }
    .products-table tbody tr {
      transition: background 0.12s;
    }
    .products-table tbody tr:hover {
      background: rgba(36,87,255,0.03);
    }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f1f4fa;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .rank-badge.top { background: var(--accent-soft); color: var(--accent); }
    .product-id-cell {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.85rem;
      color: var(--text);
    }
    .ctr-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctr-bar-track {
      flex: 1;
      min-width: 40px;
      max-width: 80px;
      height: 6px;
      background: #edf1f7;
      border-radius: 3px;
      overflow: hidden;
    }
    .ctr-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .empty-table {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .empty-table .empty-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 2rem;
      opacity: 0.4;
    }

    /* ─── States ─── */
    .dash-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 48px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dash-error {
      border: 1px dashed rgba(180,35,24,0.25);
      border-radius: 16px;
      padding: 24px;
      color: var(--error);
      background: rgba(180,35,24,0.04);
      text-align: center;
      font-size: 0.92rem;
    }

    /* ─── Responsive ─── */
    @media (max-width: 720px) {
      .dash-header { flex-direction: column; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .controls-strip { flex-direction: column; align-items: stretch; }
      .last-update { margin-left: 0; }
      .table-section { padding: 14px; overflow-x: auto; }
      .products-table { min-width: 500px; }
    }
    @media (max-width: 480px) {
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dash-shell">
    <!-- Back link -->
    <a href="index.html" class="back-link" id="backLink">← Volver a Demo</a>

    <!-- Header -->
    <header class="dash-header">
      <div class="dash-header-left">
        <p class="eyebrow">Sistema de recomendaciones</p>
        <h1 class="dash-title">Dashboard de Métricas</h1>
        <p class="dash-subtitle">Evaluación del motor de recomendación</p>
      </div>
      <div class="badge">◆ Módulo 9</div>
    </header>

    <!-- Controls -->
    <div class="controls-strip">
      <label class="field-sm">
        <span>Ventana (días)</span>
        <input id="inputDays" type="number" value="30" min="1" max="365" aria-label="Días de ventana temporal">
      </label>
      <label class="field-sm">
        <span>Top productos</span>
        <input id="inputTopN" type="number" value="10" min="1" max="100" aria-label="Cantidad de top productos">
      </label>
      <button id="btnRefresh" class="btn-primary" type="button">Actualizar</button>
      <span id="lastUpdate" class="last-update"></span>
    </div>

    <!-- Content (populated by JS) -->
    <div id="dashContent">
      <div class="dash-loading" id="dashLoading">
        <div class="spinner"></div>
        <span>Cargando métricas...</span>
      </div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       Dashboard de Métricas — Módulo 9
       Vanilla JS · fetch · sin dependencias externas
       No depende de app.js
       ═══════════════════════════════════════════════════════════════ */

    const API_BASE = 'http://127.0.0.1:8010';

    // ── Utilidades ──────────────────────────────────────────────────

    function formatPercent(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return 'N/A';
      return (num * 100).toFixed(2) + '%';
    }

    function formatNumber(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return '0';
      return num.toLocaleString('es-DO');
    }

    function formatTimestamp(isoString) {
      if (!isoString) return '';
      try {
        const d = new Date(isoString);
        return d.toLocaleString('es-DO', {
          dateStyle: 'medium',
          timeStyle: 'short',
        });
      } catch {
        return isoString;
      }
    }

    // ── Fetch ────────────────────────────────────────────────────────

    async function loadMetrics() {
      const days = parseInt(document.getElementById('inputDays').value, 10) || 30;
      const topN = parseInt(document.getElementById('inputTopN').value, 10) || 10;
      const content = document.getElementById('dashContent');
      const btn = document.getElementById('btnRefresh');

      // Show loading
      content.innerHTML = `
        <div class="dash-loading" id="dashLoading">
          <div class="spinner"></div>
          <span>Cargando métricas...</span>
        </div>`;
      btn.disabled = true;

      try {
        const response = await fetch(
          `${API_BASE}/admin/metrics?days=${days}&top_n=${topN}`
        );
        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }
        const data = await response.json();
        renderMetrics(data);
      } catch (err) {
        content.innerHTML = `
          <div class="dash-error">
            <strong>No se pudieron cargar las métricas</strong><br>
            <span>${err.message || 'El backend no respondió.'}</span><br>
            <small style="opacity:0.7;margin-top:6px;display:inline-block">
              Verifica que el servidor esté activo en ${API_BASE}
            </small>
          </div>`;
      } finally {
        btn.disabled = false;
      }
    }

    // ── Render ───────────────────────────────────────────────────────

    function renderMetrics(data) {
      const content = document.getElementById('dashContent');
      const d = {
        window_days: data.window_days ?? 30,
        generated_at: data.generated_at ?? null,
        recommendations_served: data.recommendations_served ?? 0,
        items_served: data.items_served ?? 0,
        clicks: data.clicks ?? 0,
        ctr_item: data.ctr_item ?? 0,
        ctr_response: data.ctr_response ?? 0,
        conversions_direct: data.conversions_direct ?? 0,
        conversion_rate_direct: data.conversion_rate_direct ?? 0,
        top_recommended_products: data.top_recommended_products ?? [],
      };

      // Update last-update badge
      const lastUpdate = document.getElementById('lastUpdate');
      lastUpdate.textContent = d.generated_at
        ? `Última actualización: ${formatTimestamp(d.generated_at)}`
        : '';

      content.innerHTML = `
        ${renderKPIs(d)}
        ${renderHealth(d)}
        ${renderTopProducts(d)}
      `;
    }

    function renderKPIs(d) {
      return `
        <div class="kpi-grid">
          <div class="kpi-card accent">
            <span class="kpi-label">CTR por ítem</span>
            <span class="kpi-value">${formatPercent(d.ctr_item)}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">CTR por respuesta</span>
            <span class="kpi-value">${d.ctr_response > 0 ? formatPercent(d.ctr_response) : 'N/A'}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Tasa de conversión</span>
            <span class="kpi-value">${formatPercent(d.conversion_rate_direct)}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Clicks totales</span>
            <span class="kpi-value">${formatNumber(d.clicks)}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Recomendaciones</span>
            <span class="kpi-value">${formatNumber(d.recommendations_served)}</span>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Ítems servidos</span>
            <span class="kpi-value">${formatNumber(d.items_served)}</span>
          </div>
        </div>`;
    }

    function renderHealth(d) {
      const signals = [];

      if (d.recommendations_served === 0) {
        signals.push({ color: 'gray', text: 'Sin datos suficientes — no se han registrado recomendaciones en esta ventana.' });
      } else {
        signals.push({ color: 'green', text: `${formatNumber(d.recommendations_served)} recomendaciones servidas en los últimos ${d.window_days} días.` });
      }

      if (d.ctr_item > 0) {
        signals.push({ color: 'green', text: 'El motor ya registra interacción — los usuarios clickean ítems recomendados.' });
      } else if (d.recommendations_served > 0) {
        signals.push({ color: 'amber', text: 'Recomendaciones servidas pero sin clicks registrados aún.' });
      }

      if (d.conversion_rate_direct > 0) {
        signals.push({ color: 'blue', text: `Existen conversiones directas atribuidas (${formatPercent(d.conversion_rate_direct)}).` });
      } else if (d.recommendations_served > 0) {
        signals.push({ color: 'amber', text: 'Aún no hay conversiones directas atribuidas a recomendaciones.' });
      }

      if (d.recommendations_served === 0 && d.clicks === 0 && d.conversions_direct === 0) {
        signals.length = 0;
        signals.push({ color: 'gray', text: 'Tracking activo, esperando actividad. Las métricas aparecerán cuando se sirvan y clickeen recomendaciones.' });
      }

      const items = signals.map(s => `
        <div class="health-item">
          <span class="health-dot ${s.color}"></span>
          <span>${s.text}</span>
        </div>`).join('');

      return `
        <div class="health-section">
          <h2 class="section-title">Estado del motor</h2>
          <div class="health-grid">${items}</div>
        </div>`;
    }

    function renderTopProducts(d) {
      const products = d.top_recommended_products || [];
      const countLabel = products.length > 0
        ? `${products.length} producto${products.length > 1 ? 's' : ''}`
        : '';

      if (products.length === 0) {
        return `
          <div class="table-section">
            <div class="table-header">
              <h2>Top productos recomendados</h2>
            </div>
            <div class="empty-table">
              <span class="empty-icon">📦</span>
              Aún no hay productos recomendados registrados.
            </div>
          </div>`;
      }

      // Find max CTR for bar scaling
      const maxCtr = Math.max(...products.map(p => Number(p.ctr || 0)), 0.001);

      const rows = products.map((p, i) => {
        const ctr = Number(p.ctr || 0);
        const barPct = Math.min((ctr / maxCtr) * 100, 100);
        const rankClass = i < 3 ? 'top' : '';
        return `
          <tr>
            <td><span class="rank-badge ${rankClass}">${i + 1}</span></td>
            <td class="product-id-cell">${p.product_id || 'N/A'}</td>
            <td>${formatNumber(p.recommendation_count ?? p.count ?? 0)}</td>
            <td>${formatNumber(p.click_count ?? 0)}</td>
            <td>
              <div class="ctr-bar">
                <span>${formatPercent(ctr)}</span>
                <div class="ctr-bar-track">
                  <div class="ctr-bar-fill" style="width:${barPct.toFixed(1)}%"></div>
                </div>
              </div>
            </td>
          </tr>`;
      }).join('');

      return `
        <div class="table-section">
          <div class="table-header">
            <h2>Top productos recomendados</h2>
            <span class="table-count">${countLabel}</span>
          </div>
          <table class="products-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Product ID</th>
                <th>Recomendaciones</th>
                <th>Clicks</th>
                <th>CTR</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // ── Init ─────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnRefresh').addEventListener('click', loadMetrics);

      // Enter key triggers reload on inputs
      document.getElementById('inputDays').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadMetrics();
      });
      document.getElementById('inputTopN').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') loadMetrics();
      });

      // Auto-load on page open
      loadMetrics();
    });
  </script>
</body>
</html>
